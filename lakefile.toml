name = "LeanClick"
version = "0.1.0"
defaultTargets = ["LeanClick", "props", "conformance", "example", "hello", "colors", "naval", "inout", "validation", "repo", "complex", "completion", "termui", "aliases", "prompts", "docs-quickstart", "docs-options", "docs-advanced", "docs-arguments", "docs-commands-and-groups", "docs-commands", "docs-documentation", "docs-exceptions", "docs-entry-points", "docs-extending-click", "docs-faqs", "docs-handling-files", "docs-index", "docs-option-decorators", "docs-parameters", "docs-parameter-types", "docs-prompts", "docs-readme", "docs-testing", "docs-complex", "docs-shell-completion", "docs-standalone-apps", "docs-utils"]

# The verified library. Everything under LeanClick/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanClick"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# The fastapi dev/run shape on top of LeanClick.Terminal: `lake exe example`.
[[lean_exe]]
name = "example"
root = "tests.apps.FastapiCli"

# click's README quickstart: `lake exe hello --count=3`.
[[lean_exe]]
name = "hello"
root = "tests.apps.Hello"

# click's examples/, ported one to one (see examples/MANIFEST.toml).
[[lean_exe]]
name = "colors"
root = "examples.colors.colors"

[[lean_exe]]
name = "naval"
root = "examples.naval.naval"

[[lean_exe]]
name = "inout"
root = "examples.inout.inout"

[[lean_exe]]
name = "validation"
root = "examples.validation.validation"

[[lean_exe]]
name = "repo"
root = "examples.repo.repo"

[[lean_exe]]
name = "complex"
root = "examples.complex.complex.cli"

# modules the example programs import: complex's plugins, the docs runner
[[lean_lib]]
name = "ExampleModules"
roots = ["examples.complex.complex.environment", "examples.complex.complex.commands.cmd_init",
         "examples.complex.complex.commands.cmd_status", "examples.docs.runner"]

[[lean_exe]]
name = "completion"
root = "examples.completion.completion"

[[lean_exe]]
name = "termui"
root = "examples.termui.termui"

[[lean_exe]]
name = "aliases"
root = "examples.aliases.aliases"

# prompts run as a process (tests/golden/click.json)
[[lean_exe]]
name = "prompts"
root = "tests.apps.Prompts"

# click's docs pages, one program per page (examples/docs/)
[[lean_exe]]
name = "docs-quickstart"
root = "examples.docs.quickstart"

[[lean_exe]]
name = "docs-options"
root = "examples.docs.options"

[[lean_exe]]
name = "docs-advanced"
root = "examples.docs.advanced"

[[lean_exe]]
name = "docs-arguments"
root = "examples.docs.arguments"

[[lean_exe]]
name = "docs-commands-and-groups"
root = "examples.docs.commands_and_groups"

[[lean_exe]]
name = "docs-commands"
root = "examples.docs.commands"

[[lean_exe]]
name = "docs-documentation"
root = "examples.docs.documentation"

[[lean_exe]]
name = "docs-exceptions"
root = "examples.docs.exceptions"

[[lean_exe]]
name = "docs-entry-points"
root = "examples.docs.entry_points"

[[lean_exe]]
name = "docs-extending-click"
root = "examples.docs.extending_click"

[[lean_exe]]
name = "docs-faqs"
root = "examples.docs.faqs"

[[lean_exe]]
name = "docs-handling-files"
root = "examples.docs.handling_files"

[[lean_exe]]
name = "docs-index"
root = "examples.docs.index"

[[lean_exe]]
name = "docs-option-decorators"
root = "examples.docs.option_decorators"

[[lean_exe]]
name = "docs-parameters"
root = "examples.docs.parameters"

[[lean_exe]]
name = "docs-parameter-types"
root = "examples.docs.parameter_types"

[[lean_exe]]
name = "docs-prompts"
root = "examples.docs.prompts"

[[lean_exe]]
name = "docs-readme"
root = "examples.docs.readme"

[[lean_exe]]
name = "docs-testing"
root = "examples.docs.testing"

[[lean_exe]]
name = "docs-complex"
root = "examples.docs.complex"

[[lean_exe]]
name = "docs-shell-completion"
root = "examples.docs.shell_completion"

[[lean_exe]]
name = "docs-standalone-apps"
root = "examples.docs.standalone_apps"

[[lean_exe]]
name = "docs-utils"
root = "examples.docs.utils"

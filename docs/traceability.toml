realises = ["LeanClick.Command.formatHelp", "LeanClick.Command.allParams"]
theorem = ["LeanClick.help_lists_every_param", "LeanClick.help_lists_every_argument", "LeanClick.help_lists_every_subcommand"]
test = ["tests/Props.lean::helpListsSpellings", "tests/Conformance.lean::help paragraphs and \\b blocks"]

[[requirement]]

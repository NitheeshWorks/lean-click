# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "click"
upstream_url = "https://github.com/pallets/click"
upstream_commit = "2247b35ea1c47c727d7a06e51fa280e12a863ff6"
upstream_license = "BSD-3-Clause"


[[requirement]]
id = "parser.undeclared-option"
upstream = "tests/test_options.py::test_unknown_options"
title = "An undeclared option is an error (No such option), with did-you-mean hints"
status = "implemented"
realises = ["LeanClick.processOpt", "LeanClick.scanLoop"]
theorem = ["LeanClick.undeclared_option_rejected", "LeanClick.scanLoop_undeclared"]
test = ["tests/Conformance.lean::unknown long option"]

[[requirement]]
id = "parser.deterministic"
upstream = "docs: Parameters / Values from Environment Variables"
title = "The parser reads the environment only through the declared variable names"
status = "implemented"
realises = ["LeanClick.Command.parseWith", "LeanClick.Command.parseArgs"]
theorem = ["LeanClick.parse_env_local", "LeanClick.parseWith_congr"]
test = ["tests/Props.lean::declaredAccepted"]

[[requirement]]
id = "parser.required"
upstream = "tests/test_basic.py::test_required_option"
title = "Required parameters with no value are reported as missing; a successful parse never leaves one missing"
status = "implemented"
realises = ["LeanClick.resolveParam", "LeanClick.Param.missingError"]
theorem = ["LeanClick.required_missing_error", "LeanClick.required_present"]
test = ["tests/Conformance.lean::required option missing"]

[[requirement]]
id = "parser.nargs"
upstream = "tests/test_arguments.py::test_nargs_tup"
title = "nargs=n yields exactly n values per occurrence"
status = "implemented"
realises = ["LeanClick.takeValues", "LeanClick.Entry"]
theorem = ["LeanClick.nargs_arity", "LeanClick.takeValues_length", "LeanClick.entry_many_length"]
test = ["tests/Conformance.lean::nargs=2 argument"]

[[requirement]]
id = "types.choice"
upstream = "tests/test_basic.py::test_choice_option"
title = "Choice values are refined to members of the choices; the first normalised match is returned"
status = "implemented"
realises = ["LeanClick.matchChoice", "LeanClick.ParamType.Carrier"]
theorem = ["LeanClick.choice_in_set"]
test = ["tests/Conformance.lean::choice option value"]

[[requirement]]
id = "types.range"
upstream = "tests/test_options.py::test_counting"
title = "IntRange/FloatRange values carry their bounds proof; out of range is an error, clamp clamps"
status = "implemented"
realises = ["LeanClick.convertIntRange", "LeanClick.convertFloatRange"]
test = ["tests/Conformance.lean::count out of range"]

[[requirement]]
id = "flags.pairs"
upstream = "tests/test_basic.py::test_boolean_switch"
title = "--x stores true, --no-x stores false; over any sequence of the flag's spellings the last one wins"
status = "implemented"
realises = ["LeanClick.Param.flag", "LeanClick.cmdRaw"]
theorem = ["LeanClick.bool_flag_pairs"]
test = ["tests/Conformance.lean::switch --off, unset", "tests/Props.lean::lastWins"]

[[requirement]]
id = "sources.precedence"
upstream = "tests/test_options.py::test_multiple_envvar"
title = "Command line (last occurrence, --o v or --o=v) beats environment variable beats default, for any argv; LeanClick.parse is parseArgs (parse_val)"
status = "implemented"
realises = ["LeanClick.consume", "LeanClick.envString"]
theorem = ["LeanClick.commandline_beats_envvar", "LeanClick.envvar_beats_default", "LeanClick.default_when_absent", "LeanClick.scanLoop_events", "LeanClick.scanLoop_values", "LeanClick.parse_val"]
test = ["tests/Conformance.lean::last command-line occurrence beats PORT", "tests/Conformance.lean::command line beats PORT"]

[[requirement]]
id = "groups.dispatch"
upstream = "tests/test_commands.py::test_group_with_args"
title = "A group dispatches to the first subcommand with the name"
status = "implemented"
realises = ["LeanClick.Command.parseLevel", "LeanClick.Command.findSub"]
theorem = ["LeanClick.group_dispatch_first_match"]
test = ["tests/Conformance.lean::first subcommand of a name wins"]

[[requirement]]
id = "exit.codes"
upstream = "tests/test_commands.py::test_command_no_args_is_help"
title = "Exit codes: 0 success/help/version, 1 abort/ClickException, 2 usage error, Exit(n) mod 256"
status = "implemented"
realises = ["LeanClick.Termination.exitCode"]
theorem = ["LeanClick.exit_code_range", "LeanClick.framework_exit_codes", "LeanClick.usage_error_exit_2"]
test = ["tests/Conformance.lean::no_args_is_help exits 2 with the help"]

[[requirement]]
id = "help.table"
upstream = "tests/test_basic.py::test_choice_option"
title = "Help is rendered from Command.allParams, the parser's table: every visible option, documented argument and visible subcommand is listed"

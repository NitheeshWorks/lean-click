# click's examples/ and the Python code blocks of its README and docs pages,
# ported one to one; checked by stack-tools/check-examples.py. Printed
# output of every ported program is compared with click 8.5.0 running the
# original (tests/golden/click.json). A docs block is cited as
# docs/<page>.md#block-<n>, numbered by tests/golden/docblocks.py (which
# also counts the click:run blocks, so the code blocks' numbers have gaps).

[meta]
upstream = "click"
sources = ["examples"]
helpers = ["examples/complex/complex/environment.lean", "examples/docs/runner.lean"]
doc_pages = [
  "README.md",
  "docs/quickstart.md",
  "docs/options.md",
  "docs/advanced.md",
  "docs/arguments.md",
  "docs/commands-and-groups.md",
  "docs/commands.md",
  "docs/documentation.md",
  "docs/exceptions.md",
  "docs/entry-points.md",
  "docs/extending-click.md",
  "docs/faqs.md",
  "docs/handling-files.md",
  "docs/index.md",
  "docs/option-decorators.md",
  "docs/parameters.md",
  "docs/parameter-types.md",
  "docs/prompts.md",
  "docs/testing.md",
  "docs/complex.md",
  "docs/shell-completion.md",
  "docs/standalone-apps.md",
  "docs/support-multiple-versions.md",
  "docs/unicode-support.md",
  "docs/utils.md",
]

[[example]]
upstream = "examples/README"
lean = "examples/README.md"
status = "ported"


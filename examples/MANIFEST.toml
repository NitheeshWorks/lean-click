# click's examples/, ported one to one; checked by
# stack-tools/check-examples.py. Printed output of every ported program is
# compared with click 8.5.0 running the original (tests/golden/click.json).

[meta]
upstream = "click"
sources = ["examples"]
helpers = ["examples/complex/complex/environment.lean"]

[[example]]
upstream = "examples/README"
lean = "examples/README.md"
status = "ported"

[[example]]
upstream = "examples/aliases/aliases.py"
lean = "examples/aliases/aliases.lean"
status = "ported"
output = "tests/golden/click.json::process aliases"

[[example]]
upstream = "examples/aliases/aliases.ini"
lean = "examples/aliases/aliases.ini"
status = "ported"

[[example]]
upstream = "examples/aliases/README"
lean = "examples/aliases/README.md"
status = "ported"

[[example]]
upstream = "examples/aliases/pyproject.toml"
status = "excluded"
reason = "packaging; the program is the `aliases` lean_exe in lakefile.toml"

